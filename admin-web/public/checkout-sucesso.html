<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atravessia · Pagamento confirmado</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #4A4B4A;
      background: radial-gradient(70% 50% at 15% 10%, rgba(139,122,192,.16), transparent 60%), #FAF7F3; }
    .card { max-width: 400px; text-align: center; background: #FFFDF9; border: 1px solid #E6DDD2;
      border-radius: 20px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(107,91,122,.12); }
    .selo { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px; display: grid;
      place-items: center; background: #E8F0E9; color: #4A6B4E; font-size: 28px; }
    h1 { font-family: Georgia, serif; font-style: italic; font-weight: 400; color: #8B7AC0; margin: 0 0 8px; font-size: 26px; }
    p { margin: 0; line-height: 1.6; font-size: 15px; color: #76737A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="selo">&#10003;</div>
    <h1>Pagamento confirmado</h1>
    <p>Obrigada por confiar na Atravessia. Seu acesso já está liberado — pode fechar esta janela e voltar ao aplicativo.</p>
  </div>
</body>
</html>
