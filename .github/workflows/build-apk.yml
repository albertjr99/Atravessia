name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        working-directory: oamorqueefica
        run: npm install

      - name: Expo Prebuild (gerar pasta android)
        working-directory: oamorqueefica
        run: npx expo prebuild --platform android --clean --no-install

      - name: Gerar keystore para assinatura
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore ${{ github.workspace }}/keystore.jks \
            -alias atravessia -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Atravessia, OU=App, O=Atravessia, L=BR, ST=BR, C=BR" \
            -storepass android123 -keypass android123

      - name: Build APK release
        working-directory: oamorqueefica/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=atravessia \
            -Pandroid.injected.signing.key.password=android123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atravessia-release
          path: oamorqueefica/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
