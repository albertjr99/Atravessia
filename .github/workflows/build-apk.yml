name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        working-directory: oamorqueefica
        run: npm install

      - name: Expo Prebuild (gerar pasta android)
        working-directory: oamorqueefica
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK debug
        working-directory: oamorqueefica/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atravessia-debug
          path: oamorqueefica/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
