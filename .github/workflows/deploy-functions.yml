name: Deploy Firebase

# As regras e os índices do Firestore nunca eram publicados por aqui: o passo
# abaixo rodava com --only functions. Toda mudança em firestore.rules só valia
# se alguém rodasse `firebase deploy` à mão — por isso o painel administrativo
# via "missing or insufficient permissions" mesmo com a regra certa no repositório.
on:
  push:
    paths:
      - 'functions/**'
      - 'oamorqueefica/firestore.rules'
      - 'oamorqueefica/storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'admin-web/dist/**'
      - 'oamorqueefica/src/**'
      - 'oamorqueefica/assets/**'
      - 'oamorqueefica/app.json'
      - 'oamorqueefica/web/**'
      - 'oamorqueefica/package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Conferir credencial
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::O secret FIREBASE_TOKEN não está definido no repositório."
            echo "Gere um token com 'npx firebase-tools login:ci' e adicione em"
            echo "Settings > Secrets and variables > Actions como FIREBASE_TOKEN."
            exit 1
          fi

      # Chaves da Stripe guardadas nos secrets do GitHub (STRIPE_SECRET_KEY e
      # STRIPE_WEBHOOK_SECRET) vão para o Secret Manager do Firebase antes do
      # deploy. Se não estiverem no GitHub, fica valendo o que já está no Firebase.
      # Versão web do app da usuária em /app (para usar no iPhone pelo Safari,
      # "Adicionar à Tela de Início", enquanto a versão iOS não sai).
      - name: Gerar o app web (/app)
        working-directory: oamorqueefica
        run: |
          npm ci --no-audit --no-fund
          npx expo export --platform web --output-dir web-build
          node web/preparar-pwa.js web-build
          rm -rf ../admin-web/dist/app
          cp -r web-build ../admin-web/dist/app

      - name: Sincronizar chaves da Stripe
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          for nome in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            valor="${!nome}"
            if [ -n "$valor" ]; then
              printf '%s' "$valor" | npx firebase-tools functions:secrets:set "$nome" --data-file=- --force --token "$FIREBASE_TOKEN" --non-interactive
              echo "$nome atualizado no Firebase."
            else
              echo "$nome não está nos secrets do GitHub; mantendo o valor atual do Firebase."
            fi
          done

      - name: Deploy
        run: >
          npx firebase-tools deploy
          --only functions,firestore:rules,firestore:indexes,storage,hosting
          --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Endereço com o nome da marca: o projeto do Firebase continua se chamando
      # o-amor-que-fica (isso não muda), mas um segundo site do Hosting publica o
      # mesmo painel e as mesmas páginas em atravessia.web.app (ou
      # atravessia-app.web.app, se o primeiro nome já tiver dono). O endereço
      # antigo continua no ar, para cupons, links e QR codes já enviados.
      - name: Publicar também no site Atravessia
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          SITE=""
          for candidato in atravessia atravessia-app; do
            if npx firebase-tools hosting:sites:list --json --token "$FIREBASE_TOKEN" --non-interactive | grep -q "\"sites/$candidato\""; then
              SITE="$candidato"; break
            fi
            if npx firebase-tools hosting:sites:create "$candidato" --token "$FIREBASE_TOKEN" --non-interactive; then
              SITE="$candidato"; break
            fi
          done
          if [ -z "$SITE" ]; then echo "::warning::Não foi possível criar o site com o nome Atravessia."; exit 0; fi
          node -e "
            const c = require('./firebase.json');
            require('fs').writeFileSync('firebase.site-atravessia.json', JSON.stringify({ hosting: { ...c.hosting, site: process.argv[1] } }));
          " "$SITE"
          npx firebase-tools deploy --only hosting --config firebase.site-atravessia.json --token "$FIREBASE_TOKEN" --non-interactive
          echo "Publicado em https://$SITE.web.app"
